    <text x="0" y="0" font-size="13" fill="#333" font-weight="bold">测试结论：</text>
    <text x="80" y="0" font-size="12" fill="#666">导航栏在 1920 / 1024 / 768 / 375 四种视口下均可正常显示，</text>
    <text x="80" y="16" font-size="12" fill="#666">PC 和平板保持完整菜单；手机端通过 @media (max-width:767px) 隐藏菜单避免拥挤，核心元素 logo/登录/注册保留可点击。</text>
