<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <!-- 草图标注 -->
  <text x="20" y="22" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#bbb" font-style="italic">设计草图 · 左图右文专题推荐区块 Topic</text>

  <!-- 卡片外框（圆角 + 阴影示意） -->
  <rect x="20" y="40" width="1160" height="460" fill="#ffffff" stroke="#ddd" stroke-width="1.5" rx="10"/>
  <!-- 阴影示意 -->
  <rect x="24" y="44" width="1152" height="452" fill="none" stroke="#eee" stroke-width="1" rx="8"/>

  <!-- ===== 左侧：大图占位 ===== -->
  <rect x="20" y="40" width="580" height="460" fill="#f9f9f9" stroke="#bbb" stroke-width="1.5" stroke-dasharray="8 5" rx="10"/>
  <!-- X 交叉线 -->
  <line x1="20" y1="40" x2="600" y2="500" stroke="#ddd" stroke-width="1"/>
  <line x1="600" y1="40" x2="20" y2="500" stroke="#ddd" stroke-width="1"/>
  <!-- 图片图标 -->
  <rect x="260" y="200" width="80" height="60" fill="none" stroke="#bbb" stroke-width="2" rx="4"/>
  <circle cx="285" cy="220" r="8" fill="none" stroke="#bbb" stroke-width="2"/>
  <path d="M 260 260 L 290 235 L 310 250 L 340 220 L 340 260 Z" fill="none" stroke="#bbb" stroke-width="2"/>
  <text x="270" y="300" font-family="sans-serif" font-size="13" fill="#bbb">专题封面大图 50%</text>
  <!-- 标注 -->
  <text x="40" y="510" font-family="sans-serif" font-size="9" fill="#bbb">← 左侧图片区域 →</text>

  <!-- 分割线 -->
  <line x1="600" y1="60" x2="600" y2="480" stroke="#eee" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===== 右侧文字区 ===== -->
  <!-- 标签：绿色胶囊 -->
  <rect x="650" y="90" width="80" height="26" fill="#00b96b" stroke="none" rx="13"/>
  <text x="660" y="108" font-family="'PingFang SC',sans-serif" font-size="12" fill="#ffffff" font-weight="bold">专题推荐</text>
  <text x="650" y="80" font-family="sans-serif" font-size="9" fill="#bbb">绿色标签</text>

  <!-- 标题 -->
  <text x="650" y="160" font-family="'PingFang SC',sans-serif" font-size="22" fill="#222" font-weight="bold">城市光影：记录都市的呼吸与脉搏</text>
  <text x="650" y="190" font-family="sans-serif" font-size="9" fill="#bbb">← 板块标题 h3</text>

  <!-- 描述文字（多条灰色线模拟段落） -->
  <line x1="650" y1="220" x2="1130" y2="220" stroke="#ccc" stroke-width="2"/>
  <line x1="650" y1="240" x2="1130" y2="240" stroke="#ccc" stroke-width="2"/>
  <line x1="650" y1="260" x2="1130" y2="260" stroke="#ccc" stroke-width="2"/>
  <line x1="650" y1="280" x2="1080" y2="280" stroke="#ccc" stroke-width="2"/>
  <line x1="650" y1="300" x2="1130" y2="300" stroke="#ccc" stroke-width="2"/>
  <line x1="650" y1="320" x2="1000" y2="320" stroke="#ccc" stroke-width="2"/>
  <text x="650" y="345" font-family="sans-serif" font-size="9" fill="#bbb">← 描述文字段落</text>

  <!-- 元信息 -->
  <line x1="650" y1="400" x2="900" y2="400" stroke="#ddd" stroke-width="1"/>
  <text x="650" y="395" font-family="'PingFang SC',sans-serif" font-size="12" fill="#999">收录作品 1280 张 · 参与摄影师 456 位</text>
  <text x="650" y="415" font-family="sans-serif" font-size="9" fill="#bbb">← 元信息</text>

  <!-- 右侧标注 -->
  <text x="650" y="490" font-family="sans-serif" font-size="9" fill="#bbb">← 右侧文字区域 50% →</text>
</svg>
