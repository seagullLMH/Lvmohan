  <!-- 卡片5 -->
  <g>
    <rect x="970" y="115" width="210" height="290" fill="#ffffff" stroke="#ddd" stroke-width="1.5" rx="10"/>
    <rect x="970" y="115" width="210" height="200" fill="#f9f9f9" stroke="#bbb" stroke-width="1.5" stroke-dasharray="8 5" rx="10"/>
