<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
  <!-- 草图标注 -->
  <text x="20" y="22" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#bbb" font-style="italic">设计草图 · 精选作品卡片列表 Works</text>

  <!-- ===== 板块头部 ===== -->
  <!-- 绿色竖线装饰 -->
  <rect x="30" y="55" width="4" height="20" fill="#00b96b" rx="2"/>
  <text x="44" y="72" font-family="'PingFang SC',sans-serif" font-size="20" fill="#222" font-weight="bold">精选作品</text>
  <text x="30" y="45" font-family="sans-serif" font-size="9" fill="#bbb">绿色竖线 + 标题</text>

  <!-- 查看更多 -->
  <text x="1090" y="72" font-family="'PingFang SC',sans-serif" font-size="14" fill="#999">查看更多 ›</text>
  <text x="1080" y="45" font-family="sans-serif" font-size="9" fill="#bbb">右对齐链接</text>

  <!-- 头部分割线 -->
  <line x1="30" y1="95" x2="1170" y2="95" stroke="#eee" stroke-width="1"/>

  <!-- ===== 5 张卡片 ===== -->
