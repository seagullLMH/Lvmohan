    <path d="M 100 230 L 125 210 L 140 222 L 170 195 L 170 230 Z" fill="none" stroke="#ccc" stroke-width="2"/>
    <!-- 标题 -->
    <text x="44" y="345" font-family="'PingFang SC',sans-serif" font-size="15" fill="#333" font-weight="500">清晨的薄雾</text>
    <!-- 作者 -->
    <text x="44" y="375" font-family="'PingFang SC',sans-serif" font-size="13" fill="#999">摄影师 · 林一</text>
    <text x="44" y="395" font-family="sans-serif" font-size="9" fill="#bbb">↑标题  ↑作者</text>
  </g>

