<!DOCTYPE html>
<!--
    ============================================================
    课程作业：移动端固定底部导航栏（字体图标版）
    学号：24005240119   姓名：lvmohan
    图标来源：font_5244715_6fbx2jueos2/iconfont.css
    要点：fixed 固定底部 + flex:1 自适应宽度 + 徽章/红点
    ============================================================
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="author" content="lvmohan">
    <meta name="student-id" content="24005240119">
    <title>移动端底部导航（字体图标版）</title>
    <!-- 引入 iconfont 字体图标样式 -->
    <link rel="stylesheet" href="./font_5244715_6fbx2jueos2/iconfont.css">
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            background-color: #f5f5f5;
            color: #333333;
            line-height: 1.5;
            /* 预留底部导航高度，避免内容被遮挡 */
            padding-bottom: calc(56px + env(safe-area-inset-bottom));
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        /* ===== 页面顶部标题栏（示意内容）===== */
        .page-header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 48px;
            background-color: #ffffff;
            border-bottom: 1px solid #eaeaea;
            font-size: 17px;
            font-weight: 600;
        }

        /* ===== 页面示意内容区 ===== */
        .page-body {
            padding: 16px;
        }

        .demo-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
            background-color: #ffffff;
            border-radius: 10px;
        }

        .demo-card-dot {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: linear-gradient(135deg, #00b96b, #7bd8a8);
        }

        .demo-card-text {
            flex: 1;
        }

        .demo-card-title {
            font-size: 15px;
            font-weight: 600;
        }

        .demo-card-desc {
            font-size: 12px;
            color: #999999;
        }

        /* ================================================================
           移动端固定底部导航：fixed 固定 + flex 自适应宽度
           ================================================================ */
        .tabbar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 100;
            display: flex;
            align-items: stretch;
            width: 100%;
            height: calc(56px + env(safe-area-inset-bottom));
            padding-bottom: env(safe-area-inset-bottom);
            background-color: #ffffff;
            border-top: 1px solid #eaeaea;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.04);
        }

        /* 单个导航项：flex:1 平分宽度，自适应任意屏宽 */
        .tabbar-item {
            flex: 1 1 25%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 0;
            height: 100%;
            font-size: 11px;
            color: #666666;
            transition: color 0.2s ease;
        }

        /* 当前选中项：主题绿色高亮 */
        .tabbar-item.is-active {
            color: #00b96b;
        }

        /* 图标包裹层：徽章/红点相对此层定位 */
        .tabbar-icon {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 26px;
            margin-bottom: 2px;
        }

        /* 字体图标尺寸 */
        .tabbar-icon .iconfont {
            font-size: 24px;
            line-height: 1;
        }

        /* ===== 右上角数字徽章 ===== */
        .tabbar-badge {
            position: absolute;
            top: -6px;
            left: 100%;
            transform: translateX(-50%);
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            border-radius: 8px;
            background-color: #f53f3f;
            border: 1.5px solid #ffffff;
            color: #ffffff;
            font-size: 10px;
            font-style: normal;
            font-weight: 600;
            line-height: 13px;
            text-align: center;
            white-space: nowrap;
        }

        /* ===== 右上角红点（无数字）===== */
        .tabbar-dot {
            position: absolute;
            top: -2px;
            left: 100%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #f53f3f;
            border: 1.5px solid #ffffff;
        }

        /* 文字标签 */
        .tabbar-label {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- ===== 页面顶部标题（示意）===== -->
    <header class="page-header">底部导航演示 · 字体图标版</header>

    <!-- ===== 页面示意内容：滚动查看固定效果 ===== -->
    <main class="page-body">
        <div class="demo-card">
            <span class="demo-card-dot"></span>
            <div class="demo-card-text">
                <p class="demo-card-title">首页 · 红点提示</p>
                <p class="demo-card-desc">向下滚动页面，导航栏始终固定在底部</p>
            </div>
        </div>
        <div class="demo-card">
            <span class="demo-card-dot"></span>
            <div class="demo-card-text">
                <p class="demo-card-title">收藏 · 数字徽章</p>
                <p class="demo-card-desc">图标右上角显示红色数字徽章</p>
            </div>
        </div>
        <div class="demo-card">
            <span class="demo-card-dot"></span>
            <div class="demo-card-text">
                <p class="demo-card-title">自适应宽度</p>
                <p class="demo-card-desc">4 个导航项 flex:1 平分，适配不同屏宽</p>
            </div>
        </div>
        <div class="demo-card">
            <span class="demo-card-dot"></span>
            <div class="demo-card-text">
                <p class="demo-card-title">更多 · 徽章 + 红点</p>
                <p class="demo-card-desc">99+ 超出上限时显示省略数字</p>
            </div>
        </div>
        <div class="demo-card">
            <span class="demo-card-dot"></span>
            <div class="demo-card-text">
                <p class="demo-card-title">安全区适配</p>
                <p class="demo-card-desc">使用 env(safe-area-inset-bottom) 适配刘海屏</p>
            </div>
        </div>
    </main>

    <!-- ===== 移动端固定底部导航：字体图标实现 ===== -->
    <nav class="tabbar">
        <!-- 首页：红点提示 -->
        <a href="#" class="tabbar-item is-active">
            <span class="tabbar-icon">
                <i class="iconfont icon-shouye"></i>
                <span class="tabbar-dot"></span>
            </span>
            <span class="tabbar-label">首页</span>
        </a>

        <!-- 搜索：无提示 -->
        <a href="#" class="tabbar-item">
            <span class="tabbar-icon">
                <i class="iconfont icon-sousuo"></i>
            </span>
            <span class="tabbar-label">搜索</span>
        </a>

        <!-- 收藏：数字徽章 -->
        <a href="#" class="tabbar-item">
            <span class="tabbar-icon">
                <i class="iconfont icon-shoucang"></i>
                <em class="tabbar-badge">12</em>
            </span>
            <span class="tabbar-label">收藏</span>
        </a>

        <!-- 更多：99+ 徽章 -->
        <a href="#" class="tabbar-item">
            <span class="tabbar-icon">
                <i class="iconfont icon-gengduo"></i>
                <em class="tabbar-badge">99+</em>
            </span>
            <span class="tabbar-label">更多</span>
        </a>
    </nav>

</body>
</html>
