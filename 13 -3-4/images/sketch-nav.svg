<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140">
  <!-- 草图标注 -->
  <text x="20" y="22" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#bbb" font-style="italic">设计草图 · 顶部导航栏 Header</text>

  <!-- 导航栏背景 -->
  <rect x="10" y="30" width="1180" height="90" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4"/>
  <!-- 底部分割线加粗 -->
  <line x1="10" y1="120" x2="1190" y2="120" stroke="#ccc" stroke-width="2"/>

  <!-- ===== Logo 占位 ===== -->
  <rect x="30" y="55" width="80" height="40" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4" rx="4"/>
  <line x1="30" y1="55" x2="110" y2="95" stroke="#ccc" stroke-width="1"/>
  <line x1="110" y1="55" x2="30" y2="95" stroke="#ccc" stroke-width="1"/>
  <text x="55" y="79" font-family="sans-serif" font-size="11" fill="#999">LOGO</text>
  <!-- 标注箭头 -->
  <text x="30" y="135" font-family="sans-serif" font-size="9" fill="#bbb">logo 位</text>

  <!-- ===== 导航菜单文字 ===== -->
  <text x="140" y="80" font-family="'PingFang SC',sans-serif" font-size="14" fill="#666">视频素材</text>
  <text x="220" y="80" font-family="'PingFang SC',sans-serif" font-size="14" fill="#00b96b" font-weight="bold">首页</text>
  <line x1="218" y1="86" x2="252" y2="86" stroke="#00b96b" stroke-width="2"/>
  <text x="290" y="80" font-family="'PingFang SC',sans-serif" font-size="14" fill="#666">社区</text>
  <text x="350" y="80" font-family="'PingFang SC',sans-serif" font-size="14" fill="#666">活动</text>
  <text x="410" y="80" font-family="'PingFang SC',sans-serif" font-size="14" fill="#666">短视频</text>
  <text x="480" y="80" font-family="'PingFang SC',sans-serif" font-size="14" fill="#666">发现</text>
  <text x="540" y="80" font-family="'PingFang SC',sans-serif" font-size="14" fill="#666">更多</text>
  <!-- 菜单标注 -->
  <text x="140" y="135" font-family="sans-serif" font-size="9" fill="#bbb">文字菜单（首页高亮）</text>

  <!-- ===== 右侧：搜索图标 ===== -->
  <circle cx="940" cy="75" r="8" fill="none" stroke="#999" stroke-width="1.5"/>
  <line x1="946" y1="81" x2="952" y2="87" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  <text x="920" y="135" font-family="sans-serif" font-size="9" fill="#bbb">搜索图标</text>

  <!-- ===== 登录文字 ===== -->
  <text x="980" y="80" font-family="'PingFang SC',sans-serif" font-size="13" fill="#666">登录</text>
  <text x="975" y="135" font-family="sans-serif" font-size="9" fill="#bbb">文字链接</text>

  <!-- ===== 注册按钮（绿色胶囊） ===== -->
  <rect x="1040" y="60" width="70" height="32" fill="#00b96b" stroke="none" rx="16"/>
  <text x="1058" y="81" font-family="'PingFang SC',sans-serif" font-size="13" fill="#ffffff" font-weight="bold">注册</text>
  <text x="1040" y="135" font-family="sans-serif" font-size="9" fill="#bbb">绿色按钮</text>

  <!-- 尺寸标注 -->
  <text x="1120" y="45" font-family="sans-serif" font-size="9" fill="#bbb">h:64px</text>
</svg>
