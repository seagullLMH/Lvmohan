<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<title>Flex布局演示</title>
<style>
*{
  box-sizing:border-box;
}
body{
  padding:30px;
}
h1{
  text-align:center;
}
.wrap{
  display:flex;
  gap:30px;
}
/*公共外层大盒子样式*/
.flex-box{
  width:220px;
  height:320px;
  border:1px solid #333;
  padding:15px;
}
.item{
  width:80px;
  height:80px;
  border:1px solid #333;
}

/* ==========第一个：单个方块居中 ========== */
.box1{
  display:flex;
  justify-content:center;
  align-items:center;
}
.box1 .item{
  background: #4285F4; /*蓝色*/
}

/* ==========第二个：两个方块竖直上下居中 ========== */
.box2{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:12px;
}
.box2 .item:nth-child(1){
  background: #EA4335; /*红色*/
}
.box2 .item:nth-child(2){
  background: #FBBC05; /*黄色*/
}

/* ==========第三个：2行2列四格换行 ========== */
.box3{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-content:center;
  gap:12px;
}
.box3 .item:nth-child(1){
  background: #34A853; /*绿色*/
}
.box3 .item:nth-child(2){
  background: #4285F4; /*蓝色*/
}
.box3 .item:nth-child(3){
  background: #EA4335; /*红色*/
}
.box3 .item:nth-child(4){
  background: #FBBC05; /*黄色*/
}

/* ==========第四个：上面1长块，下面并排2块（嵌套flex） ========== */
.box4{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.row-bottom{
  display:flex;
  gap:12px;
}
.top-long{
  width:100%;
  height:80px;
  border:1px solid #333;
  background:#9C27B0; /*紫色长条*/
}
.row-bottom .item:nth-child(1){
  background: #00BCD4; /*青蓝色*/
}
.row-bottom .item:nth-child(2){
  background: #FF9800; /*橙色*/
}
</style>
</head>
<body>
<h1>Flex 布局演示</h1>
<div class="wrap">
  <!--1-->
  <div class="flex-box box1">
    <div class="item"></div>
  </div>

  <!--2-->
  <div class="flex-box box2">
    <div class="item"></div>
    <div class="item"></div>
  </div>

  <!--3-->
  <div class="flex-box box3">
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
  </div>

  <!--4 嵌套flex结构-->
  <div class="flex-box box4">
    <div class="top-long"></div>
    <div class="row-bottom">
      <div class="item"></div>
      <div class="item"></div>
    </div>
  </div>
</div>

</body>
</html>
